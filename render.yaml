databases:
  - name: asistente-db
    plan: free
    databaseName: asistente
    user: asistente_user
    region: frankfurt

services:
  - type: web
    name: asistente-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        value: carlos-asistente-2026
      - key: TZ
        value: Europe/Madrid
      - key: APP_VERSION
        value: "1.1.0"
      - key: APP_VERSION_CODE
        value: "110"
      - key: DATABASE_URL
        fromDatabase:
          name: asistente-db
          property: connectionString
